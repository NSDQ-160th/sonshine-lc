# Volunteer-editable. Do not invent ages, days, fees, or camp dates.
# Fees from SSLC-Fees-Schedule.pdf (uploaded March 2024). Confirm PDF before quoting.

name: SonShine Learning Center
shortName: SonShine
tagline: A preschool ministry of Calvary Chapel Frederick
established: 2018

purpose: >-
  Our purpose is to provide quality education and tender loving care for the
  children enrolled, with emphasis on the development of Christian character,
  values, and ideals from a Biblical perspective.

mission: >-
  We provide a scriptural foundation in all areas of education, designed to
  lay a foundation for children that will serve them well throughout their lives.
  We focus on the areas of communication, problem solving, movement, music,
  and art to equip each child with the abilities necessary for successful living
  as well as nurture special God-given talents.

scripture:
  text: >-
    Train up a child in the way he should go. And when he is old he will not
    depart from it.
  ref: Proverbs 22:6

address:
  line: 244A S Jefferson St
  city: Frederick
  region: MD
  postal: "21701"
  mapsQuery: "244A S Jefferson St, Frederick, MD 21701"

phone: "+1-240-651-0890"
phoneDisplay: "(240) 651-0890"
email: sonshinelc@calvaryfrederick.com

church:
  name: Calvary Chapel Frederick
  url: https://www.calvaryfrederick.com
  phone: "+1-301-663-4485"

social:
  facebook: https://www.facebook.com/SonShineLCPreschool

program:
  ages: ages 3 and 4
  days: Monday, Wednesday, and Friday
  daysShort: Mon / Wed / Fri
  arrival: "08:45"
  classStart: "09:00"
  classEnd: "11:45"
  dismissal: "12:00"
  notes: >-
    Children should be in the room at 9:00 AM. Pickup begins at 11:45 AM.
    Morning preschool officially ends at 12:01 PM.

capacityNote: >-
  The building can accommodate up to 20 children. SonShine limits enrollment
  so the church can also use the facilities during the day. The playground
  is fenced.

msde: >-
  SonShine Learning Center is accredited by the Maryland State Department of
  Education. It is religious-exempt from Maryland licensure and self-regulates
  to exceed the state’s minimum standards for childcare workers.

nondiscrimination: >-
  SonShine Learning Center admits students of any national and ethnic origin
  to all the rights, privileges, programs, and activities generally accorded
  or made available to students at the school.

fees:
  asOf: March 2024
  source: /s/SSLC-Fees-Schedule.pdf
  registrationFirst: "$90"
  registrationAdditional: "$60"
  materials: "$200"
  monthly: "$180"
  yearly: "$1,620"
  yearlyNote: monthly fee × 9 months
  latePickup: >-
    $15 for any portion of the first 15 minutes past pickup, then $1 per minute.
    Paid in cash at pickup.
  tuitionCheck: >-
    Tuition is paid by check to Calvary Chapel Frederick, earmarked for SSLC
    with the child’s name.

calendar:
  label: 2025–2026
  firstDay: September 3
  lastDay: May 22
  items:
    - September 3 — First day of school
    - November 24 — Thanksgiving party
    - November 26–28 — Thanksgiving, no school
    - December 19 — Christmas party
    - December 22 – January 5 — Christmas, no school
    - January 19 — Martin Luther King, Jr. Day, no school
    - February 13 — Valentine’s party
    - February 16 — Presidents’ Day, no school
    - March 27 — Easter party
    - March 30 – April 6 — Spring break, no school
    - May 18 — End of the year party
    - May 22 — Last day of school

