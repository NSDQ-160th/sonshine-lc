closings:
  - If Frederick County Public Schools are closed, SonShine is closed.
  - If FCPS is delayed 2 hours, SonShine classes are cancelled.
  - If FCPS is delayed 1 hour, SonShine starts at 10:00 AM and ends at the regular time (11:45 AM–12:00 noon).
  - If FCPS closes early, SonShine ends on time unless families are notified.
  - Call the preschool line; the recording has late or closing information.

teachers:
  - name: Mhairi Lewis
    role: Director
    photo: /images/teachers/mhairi.jpg
    bio: >-
      Mhairi Lewis is the director of SonShine Learning Center. She was director
      of children’s ministry at Calvary Chapel Frederick for 9 years and has
      over 20 years of experience in children’s education. She has taken early
      childhood education classes at Liberty University and holds an SVQ from
      Scotland.
  - name: Kathy Miller
    role: Teacher’s assistant
    photo: /images/teachers/kathy.jpg
    bio: >-
      Kathleen “Kathy” Miller has served as a substitute teacher’s assistant
      and as a volunteer in children’s ministry and VBS at Calvary Chapel
      Frederick. She has a deep passion for teaching children to learn and
      grow in Christ, and for helping them develop the talents God has given them.

camp:
  showDates: false
  ages: ages 3–7
  window: mornings, 9:00 AM–12:00 PM
  note: >-
    SonShine has offered a morning Christian camp with songs, prayer, Bible
    time, crafts, outside play, games, snacks, and puppet shows. Current-year
    dates, spots, and rates are not listed here. Email Mrs. Mhairi for this
    year’s camp.

